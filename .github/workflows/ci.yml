name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-macos:
    name: macOS (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'plugin/mcp/uv.lock'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'plugin/mcp/package-lock.json'

      - name: Set up Ruby with Prism
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install locked Python dependencies
        working-directory: plugin/mcp
        run: uv sync --frozen --extra dev

      - name: Install locked Node dependencies
        working-directory: plugin/mcp
        run: npm ci

      - name: Import the MCP server
        working-directory: plugin/mcp
        run: .venv/bin/python -c "from chameleon_mcp.server import mcp; print('mcp ok')"

      - name: Run unit and harness tests
        working-directory: plugin/mcp
        env:
          PYTHONPATH: '.:../..'
        run: >-
          .venv/bin/python -m pytest
          ../../tests/unit/
          ../../tests/journey/harness/tests/
          ../../tests/effectiveness/tests/ -v

      - name: Check Python lint and formatting
        if: matrix.python-version == '3.12'
        working-directory: plugin/mcp
        run: |
          .venv/bin/ruff check chameleon_mcp/ ../../tests/unit/ ../../tests/journey/ ../scripts/ ../../scripts/
          .venv/bin/ruff format --check chameleon_mcp/ ../../tests/unit/ ../../tests/journey/ ../scripts/ ../../scripts/

      - name: Check versions, source counts, import cycles, and portable paths
        if: matrix.python-version == '3.12'
        run: |
          bash scripts/bump-version.sh --check
          plugin/mcp/.venv/bin/python scripts/check-derived-counts.py --exact
          plugin/mcp/.venv/bin/python scripts/check-import-cycle.py
          bash scripts/check-no-personal-paths.sh

      - name: Validate hooks.json references
        if: matrix.python-version == '3.12'
        run: |
          python3 << 'PYEOF'
          import json, shlex, sys, os
          errors = 0
          with open('plugin/hooks/hooks.json') as f:
              manifest = json.load(f)

          def check(path):
              global errors
              if not os.path.isfile(path):
                  print(f'ERROR: {path} missing'); errors += 1
              elif not os.access(path, os.X_OK):
                  print(f'ERROR: {path} not executable'); errors += 1

          for event, entries in manifest.get('hooks', {}).items():
              for entry in entries:
                  for hook in entry.get('hooks', []):
                      cmd = hook.get('command', '')
                      if not cmd:
                          continue
                      # Every token that names a file under plugin/hooks/ is a real
                      # entry point: the wrapper the command actually invokes AND
                      # the script name it dispatches to. Checking only the last
                      # token left run-hook.cmd itself unverified.
                      for token in shlex.split(cmd):
                          if token.startswith('-'):
                              continue  # a flag, not a path
                          token = token.replace('${CLAUDE_PLUGIN_ROOT}/', 'plugin/')
                          check(token if token.startswith('plugin/hooks/')
                                else 'plugin/hooks/' + token)
          for d in os.listdir('plugin/skills'):
              sd = os.path.join('plugin/skills', d)
              if os.path.isdir(sd) and not os.path.isfile(os.path.join(sd, 'SKILL.md')):
                  print(f'ERROR: {sd}/ missing SKILL.md'); errors += 1
          print(f'Checked hooks + skills: {errors} error(s)')
          sys.exit(1 if errors else 0)
          PYEOF
